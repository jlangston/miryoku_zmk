CONFIG_ZMK_POINTING=y

CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y

# macOS 15.6 forces known LE HID keyboards to a 15ms, CELength=4 BLE connection
# that this split board cannot sustain. Keep HID over GATT, but avoid Apple's
# low-latency match by advertising Generic HID and a non-Beekeeb PnP ID.
CONFIG_BT_DEVICE_APPEARANCE=960
CONFIG_BT_DIS_PNP_VID=0x1209
CONFIG_BT_DIS_PNP_PID=0x0001

# ZMK's default split BLE interval is 7.5ms. macOS forces the host HID link to
# 15ms / CELength=4, so use a 30ms split interval to reduce radio slot pressure.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=24

# Deep sleep after 60 min idle (default 15 min)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# 30 sec idle timeout - drops touchpad power from 2.9mA to 1.7mA
# Touchpad needs ~300ms to wake after idle, but only if no key pressed in last 30s
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Enables proper sleep notifications to Cirque driver
CONFIG_ZMK_PM_SOFT_OFF=y
