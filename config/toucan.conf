CONFIG_ZMK_POINTING=y

# Required by Cirque Pinnacle driver for sleep code
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y

# macOS keeps an internal compatibility table keyed on (VID source, VID, PID).
# When a connecting HID matches an entry, bluetoothd forces a 15ms / CELength=4
# connection interval ("isLowLatencyBLEHID ... Compatible LE HID"). On a split
# keyboard the resulting 2.5ms event window collides with the inter-half BLE
# link, packets to the Mac miss their slots, and the supervision timeout drops
# the connection ~40ms after the upgrade.
#
# The decision is cached by VID/PID and survives Forget Device + bluetoothd
# restart. The only reliable way to break the match is to advertise a different
# PnP ID via the Device Information Service. Flipping the PID is enough; we
# also set appearance to Unknown in case ZMK honours it (some shields override
# CONFIG_BT_DEVICE_APPEARANCE in code, in which case this line is a no-op).
CONFIG_BT_DIS_PNP_VID=0x1209
CONFIG_BT_DIS_PNP_PID=0x0001
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# Deep sleep after 60 min idle (default 15 min)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# 30 sec idle timeout — drops touchpad power from 2.9mA to 1.7mA
# Touchpad needs ~300ms to wake after idle, but only if no key pressed in last 30s
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Enables proper sleep notifications to Cirque driver
CONFIG_ZMK_PM_SOFT_OFF=y
