CONFIG_ZMK_POINTING=y

# Required by Cirque Pinnacle driver for sleep code
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y

# macOS recognises HID Keyboard appearance (0x03C1) + this VID/PID and forces a
# 15ms / CELength=4 connection interval. On a split keyboard the resulting 2.5ms
# event window collides with the inter-half BLE link, packets to the Mac miss
# their slots and the supervision timeout drops the connection.
# Setting appearance to Unknown (0x0000) keeps the device an HID over GATT but
# stops Apple from triggering the low-latency upgrade, so the link stays at the
# negotiated 30ms interval and survives.
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# Deep sleep after 60 min idle (default 15 min)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# 30 sec idle timeout — drops touchpad power from 2.9mA to 1.7mA
# Touchpad needs ~300ms to wake after idle, but only if no key pressed in last 30s
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Enables proper sleep notifications to Cirque driver
CONFIG_ZMK_PM_SOFT_OFF=y
